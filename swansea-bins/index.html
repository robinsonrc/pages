<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swansea Bins</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow-x: hidden; background: #f6f7f2; color: #1f271f; }
    main { width: 100%; max-width: 560px; margin: 0 auto; padding: 14px 12px 16px; }
    h1 { margin: 0 0 5px; font-size: 1.55rem; line-height: 1.05; letter-spacing: 0; }
    .meta { margin: 0 0 14px; color: #586158; font-size: 0.9rem; line-height: 1.3; }
    .collections { display: grid; gap: 10px; margin: 0 0 12px; }
    .collection { border: 1px solid transparent; border-radius: 8px; padding: 14px; }
    .collection strong { display: block; margin-bottom: 6px; font-size: 0.95rem; }
    .date { display: block; font-size: clamp(1.65rem, 7.8vw, 3rem); line-height: 1; font-weight: 800; letter-spacing: 0; white-space: nowrap; }
    .today { background: #e6e3d8; border-color: #c9c2af; color: #25241f; }
    .pink { background: #f8d7e8; border-color: #e7a9c9; color: #391527; }
    .green { background: #d8ead8; border-color: #a8c9a8; color: #102d18; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 12px 0 0; font-size: 0.92rem; }
    dt { color: #586158; }
    dd { margin: 0; font-weight: 650; }
    footer { margin-top: 14px; color: #687168; font-size: 0.8rem; line-height: 1.3; }
    @media (prefers-color-scheme: dark) {
      body { background: #111511; color: #eef3ea; }
      .meta, dt, footer { color: #aeb8aa; }
      .today { background: #34332c; border-color: #585445; color: #f4f0df; }
      .pink { background: #4a1731; border-color: #78375a; color: #ffeaf4; }
      .green { background: #173b22; border-color: #356b45; color: #e8f8ec; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Swansea Bins</h1>
    <p class="meta">BRYNTAWE ROAD, YNYSTAWE, SA6 5AD</p>
    <section class="collections" aria-label="Next collections">
      <div class="collection today">
        <strong>Today</strong>
        <span class="date" id="today-date">Today</span>
      </div>
      <div class="collection green">
        <strong>Next Green Week Collection</strong>
        <span class="date">Mon 27 Jul 2026</span>
      </div>
      <div class="collection pink">
        <strong>Next Pink Week Collection</strong>
        <span class="date">Mon 3 Aug 2026</span>
      </div>
    </section>
    <dl>
      <dt>Collection day</dt><dd>Monday</dd>
      <dt>Last updated</dt><dd>Sat 25 Jul 2026, 12:15 BST</dd>
    </dl>
    <footer>Generated from <a href="https://www.swansea.gov.uk/recyclingsearch">Swansea Council recycling collection data</a>.</footer>
  </main>
  <script>
    const today = new Date();
    const parts = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).formatToParts(today);
    const value = ['weekday', 'day', 'month', 'year'].map(type => parts.find(part => part.type === type).value).join(' ');
    document.getElementById('today-date').textContent = value;
  </script>
</body>
</html>
