<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swansea Bins</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f6f7f2; color: #1f271f; }
    main { box-sizing: border-box; min-height: 100vh; padding: 22px 18px 28px; max-width: 560px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 2rem; line-height: 1.05; letter-spacing: 0; }
    .meta { margin: 0 0 22px; color: #586158; font-size: 0.95rem; line-height: 1.4; }
    .collections { display: grid; gap: 14px; margin: 0 0 18px; }
    .collection { border: 1px solid transparent; border-radius: 8px; padding: 18px; }
    .collection strong { display: block; margin-bottom: 8px; font-size: 1rem; }
    .date { display: block; font-size: clamp(2rem, 10.8vw, 3.4rem); line-height: 1; font-weight: 800; letter-spacing: 0; white-space: nowrap; }
    .pink { background: #f8d7e8; border-color: #e7a9c9; color: #391527; }
    .green { background: #d8ead8; border-color: #a8c9a8; color: #102d18; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; margin: 18px 0 0; font-size: 0.98rem; }
    dt { color: #586158; }
    dd { margin: 0; font-weight: 650; }
    footer { margin-top: 24px; color: #687168; font-size: 0.86rem; line-height: 1.35; }
    @media (prefers-color-scheme: dark) {
      body { background: #111511; color: #eef3ea; }
      .meta, dt, footer { color: #aeb8aa; }
      .pink { background: #4a1731; border-color: #78375a; color: #ffeaf4; }
      .green { background: #173b22; border-color: #356b45; color: #e8f8ec; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Swansea Bins</h1>
    <p class="meta">BRYNTAWE ROAD, YNYSTAWE, SA6 5AD</p>
    <section class="collections" aria-label="Next collections">
      <div class="collection pink">
        <strong>Next Pink Week Collection</strong>
        <span class="date">Mon 8 Jun 2026</span>
      </div>
      <div class="collection green">
        <strong>Next Green Week Collection</strong>
        <span class="date">Mon 15 Jun 2026</span>
      </div>
    </section>
    <dl>
      <dt>Collection day</dt><dd>Monday</dd>
      <dt>Last updated</dt><dd>Sun 7 Jun 2026, 16:07 BST</dd>
    </dl>
    <footer>Generated from <a href="https://www.swansea.gov.uk/recyclingsearch">Swansea Council recycling collection data</a>.</footer>
  </main>
</body>
</html>
