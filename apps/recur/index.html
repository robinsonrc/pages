<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/pages/apps/recur/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="An offline exercise rotation tracker.">
  <meta name="theme-color" content="#66558F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Recur">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Recur</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    async function loadRecur() {
      if ('serviceWorker' in navigator) {
        try {
          const offlineReady = (async () => {
            await navigator.serviceWorker.register('recur_service_worker.js');
            await navigator.serviceWorker.ready;
            if (!navigator.serviceWorker.controller) {
              await new Promise((resolve) => {
                navigator.serviceWorker.addEventListener(
                  'controllerchange',
                  resolve,
                  {once: true},
                );
              });
            }
          })();
          await Promise.race([
            offlineReady,
            new Promise((resolve) => setTimeout(resolve, 3000)),
          ]);
        } catch (error) {
          console.warn('Recur offline setup was unavailable:', error);
        }
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    }

    loadRecur();
  </script>
</body>
</html>
